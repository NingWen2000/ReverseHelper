<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ReverseHelper terminal demonstration</title>
  <desc id="desc">A terminal-style preview showing PE information, sections, and a low risk score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#121d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="650" fill="#eef3f8"/>
  <rect x="60" y="45" width="1080" height="560" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="60" y="45" width="1080" height="48" rx="18" fill="#1d2943"/>
  <rect x="60" y="75" width="1080" height="18" fill="#1d2943"/>
  <circle cx="94" cy="69" r="7" fill="#ff6b6b"/><circle cx="118" cy="69" r="7" fill="#ffd166"/><circle cx="142" cy="69" r="7" fill="#5be7a9"/>
  <text x="600" y="75" text-anchor="middle" fill="#9db0cf" font-family="Segoe UI, sans-serif" font-size="14">ReverseHelper — static PE triage</text>
  <g font-family="Consolas, monospace" font-size="18">
    <text x="95" y="135" fill="#65d9ff" font-size="27" font-weight="700">ReverseHelper</text>
    <text x="300" y="135" fill="#8293ad">v1.0.0</text>
    <text x="95" y="168" fill="#8293ad">Target is read but never executed</text>
    <text x="95" y="222" fill="#e8eef8" font-weight="700">BASIC INFORMATION</text>
    <text x="95" y="257" fill="#8293ad">File</text><text x="285" y="257" fill="#e8eef8">python.exe  (253256 bytes)</text>
    <text x="95" y="289" fill="#8293ad">Architecture</text><text x="285" y="289" fill="#e8eef8">x86-64</text>
    <text x="95" y="321" fill="#8293ad">ImageBase</text><text x="285" y="321" fill="#ffd166">0x140000000</text>
    <text x="95" y="353" fill="#8293ad">EntryPoint</text><text x="285" y="353" fill="#ffd166">RVA 0x22CC / VA 0x1400022CC</text>
    <text x="690" y="222" fill="#e8eef8" font-weight="700">SECTIONS</text>
    <text x="690" y="257" fill="#8293ad">.text</text><text x="825" y="257" fill="#5be7a9">RX</text><text x="900" y="257" fill="#e8eef8">6.464</text>
    <text x="690" y="289" fill="#8293ad">.rdata</text><text x="825" y="289" fill="#5be7a9">R</text><text x="900" y="289" fill="#e8eef8">5.016</text>
    <text x="690" y="321" fill="#8293ad">.data</text><text x="825" y="321" fill="#ffd166">RW</text><text x="900" y="321" fill="#e8eef8">1.939</text>
    <text x="690" y="353" fill="#8293ad">.rsrc</text><text x="825" y="353" fill="#5be7a9">R</text><text x="900" y="353" fill="#e8eef8">6.171</text>
    <line x1="95" y1="395" x2="1105" y2="395" stroke="#2b3a59"/>
    <text x="95" y="442" fill="#8293ad">Imports</text><text x="285" y="442" fill="#e8eef8">92 functions / 2 libraries</text>
    <text x="95" y="476" fill="#8293ad">Packing</text><text x="285" y="476" fill="#5be7a9">no-obvious-indicators</text>
    <rect x="95" y="515" width="1010" height="58" rx="10" fill="#142a2a" stroke="#2c8b69"/>
    <text x="125" y="551" fill="#e8eef8" font-weight="700">Risk score</text><text x="285" y="551" fill="#5be7a9" font-weight="700">2.5 / 10  LOW</text>
    <text x="650" y="551" fill="#8293ad" font-size="15">Verify findings manually in Ghidra / x64dbg</text>
  </g>
</svg>
