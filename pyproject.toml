[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reversehelper"
version = "0.0.2"
description = "A practical reverse engineering assistant for CTF analysis and learning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NingWen2000" }]
keywords = ["reverse-engineering", "pe", "ctf", "ghidra", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "pefile>=2023.2.7",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
reversehelper = "reversehelper.cli:main"

[project.urls]
Homepage = "https://github.com/NingWen2000/ReverseHelper"
Repository = "https://github.com/NingWen2000/ReverseHelper"
Issues = "https://github.com/NingWen2000/ReverseHelper/issues"

[tool.setuptools.packages.find]
include = ["reversehelper*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
